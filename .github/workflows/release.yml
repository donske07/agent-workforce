name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          test -f LICENSE
          version="${GITHUB_REF_NAME#v}"
          archive="agent-workforce_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${archive}"
          flags="-s -w -X github.com/donske07/agent-workforce/internal/product.Version=${version}"
          go build -trimpath -ldflags="${flags}" -o "dist/${archive}/agent-workforce" ./cmd/agent-workforce
          go build -trimpath -ldflags="${flags}" -o "dist/${archive}/agent-workforce-mcp" ./cmd/agent-workforce-mcp
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "dist/${archive}/"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          cd dist
          sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: agent-workforce-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
