<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Agent Office</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell is-monitor-collapsed is-output-collapsed" id="appShell">
      <div class="top-bar" aria-label="Office display controls">
        <button type="button" id="monitorToggle" class="secondary-button toggle-button" aria-expanded="false" aria-controls="monitorPanel">
          Show Monitor
        </button>
        <button type="button" id="focusButton" class="primary-button toggle-button">
          Focus Pixels
        </button>
        <button type="button" id="outputToggle" class="secondary-button toggle-button" aria-expanded="false" aria-controls="outputPanel">
          Show Output • 0
        </button>
      </div>

      <section class="control-panel" id="monitorPanel" aria-labelledby="app-title" hidden>
        <div class="panel-header">
          <div>
            <p class="eyebrow">Agent Monitor</p>
            <h1 id="app-title">Pixel Agent Office</h1>
          </div>
          <button type="button" id="hideMonitorButton" class="icon-button" aria-label="Hide Agent Monitor">
            Hide
          </button>
        </div>
        <p class="intro">
          Keep this page open while agents work. MCP agent calls will turn on
          the matching thinking bubble, then turn it off when the call ends.
        </p>

        <div class="office-console" aria-live="polite">
          <div class="console-avatar" aria-hidden="true">A</div>
          <div>
            <p class="console-label">Coordinator</p>
            <p id="officeStatus">Connected to the office event stream.</p>
          </div>
        </div>

        <div class="controls" aria-label="Agent call controls">
          <button type="button" id="clearButton" class="secondary-button">
            Clear bubbles
          </button>
          <button type="button" id="demoButton" class="primary-button">
            Run delegation demo
          </button>
        </div>

        <div class="server-note">
          <span class="status-light" id="connectionLight" aria-hidden="true"></span>
          <span id="connectionStatus">Connecting...</span>
        </div>

        <div id="agentButtons" class="agent-buttons" aria-label="Manually preview expert bubbles"></div>
      </section>

      <section class="workspace" aria-label="Pixel office workspace">
        <section class="office-wrap" aria-label="Pixel office showing specialist agents">
          <div class="office" id="office" aria-live="polite"></div>
        </section>

        <aside class="output-panel" id="outputPanel" aria-label="Output transcript" hidden>
          <div class="output-header">
            <div>
              <p class="eyebrow">Output</p>
              <h2>Captured MCP Runs</h2>
            </div>
            <div class="output-actions">
              <button type="button" id="latestOutputButton" class="secondary-button compact-button latest-button" hidden>Go to latest</button>
              <button type="button" id="clearOutputButton" class="secondary-button compact-button">Clear Output</button>
              <button type="button" id="hideOutputButton" class="icon-button" aria-label="Hide Output">Hide</button>
            </div>
          </div>
          <div class="output-layout">
            <div class="run-list" id="runList" aria-label="Captured runs"></div>
            <pre class="terminal" id="terminalOutput" aria-live="polite">No output captured yet.</pre>
          </div>
        </aside>
      </section>
    </main>

    <template id="agentTemplate">
      <article class="desk" data-agent-card>
        <div class="bubble" data-bubble>
          <span class="bubble-text" data-bubble-text>Thinking...</span>
          <span class="dot dot-one"></span>
          <span class="dot dot-two"></span>
          <span class="dot dot-three"></span>
        </div>
        <div class="monitor" aria-hidden="true"></div>
        <div class="human" aria-hidden="true">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm arm-left"></div>
          <div class="arm arm-right"></div>
          <div class="leg leg-left"></div>
          <div class="leg leg-right"></div>
        </div>
        <div class="desk-top" aria-hidden="true"></div>
        <h2 data-agent-name></h2>
        <p data-agent-role></p>
      </article>
    </template>

    <script src="./agents.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
